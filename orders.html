<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d35c5"><title>ICONIC SHOP · Orders</title><style>:root{--p:#6d35c5;--bg:#f7f4fc;--ink:#241b35;--muted:#776e85;--line:#e8e0f2;--green:#16835d;--red:#c43c55;--yellow:#9a6b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:23px}.brand h1{margin:0;font-size:21px}.muted{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px;box-shadow:0 5px 20px #35204a08}.field{display:grid;gap:6px;margin:10px 0}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit}.btn{border:0;border-radius:11px;padding:10px 13px;font:inherit;font-weight:700;background:var(--p);color:#fff}.secondary{background:#f0e9fb;color:#5425a5}.approve{background:#16835d;color:#fff}.reject{background:#c43c55;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab{white-space:nowrap}.active{outline:2px solid #cdb7ed}.status{margin:9px 0;min-height:18px;font-size:13px}.orders{display:grid;gap:11px}.order{border:1px solid var(--line);border-radius:15px;padding:13px}.head{display:flex;justify-content:space-between;gap:10px}.badge{font-size:12px;font-weight:800;padding:5px 8px;border-radius:9px;white-space:nowrap}.pending{background:#fff5d8;color:var(--yellow)}.paid{background:#e5f8ef;color:var(--green)}.rejected{background:#fff0f2;color:var(--red)}.items{margin:10px 0;padding-left:18px}.empty{text-align:center;color:var(--muted);padding:25px;border:1px dashed var(--line);border-radius:14px}.hide{display:none!important}@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.wrap{padding:10px}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo">🛍️</div><div><h1>ICONIC SHOP</h1><div class="muted">Orders dashboard</div></div></div><div class="actions"><a class="btn secondary" href="/admin.html" style="text-decoration:none">← Admin</a><a class="btn secondary" href="/" style="text-decoration:none">Shop ↗</a></div></header><section id="login" class="card"><h2>🔐 Orders access</h2><div class="field"><label>Admin password</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">Open orders</button><div class="status" id="loginStatus"></div></section><section id="dash" class="hide"><div class="card"><div class="tabs"><button class="btn tab active" data-filter="ALL">All</button><button class="btn secondary tab" data-filter="PENDING">🟡 Pending</button><button class="btn secondary tab" data-filter="PAID">🟢 Paid</button><button class="btn secondary tab" data-filter="REJECTED">🔴 Rejected</button></div><div class="actions" style="margin-top:10px"><button class="btn secondary" id="refresh">Refresh</button><input id="search" placeholder="Search order / customer / phone" style="flex:1;min-width:180px;padding:10px;border:1px solid var(--line);border-radius:11px;font:inherit"></div><div class="status" id="status"></div></div><div id="list" class="orders"></div></section></main><script>const API='/.netlify/functions/orders';let pw='',orders=[],filter='ALL';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function badge(s){const x=String(s||'PENDING');return '<span class="badge '+x.toLowerCase()+'">'+esc(x)+'</span>'}async function load(){try{const r=await fetch(API,{headers:{'x-admin-password':pw}});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok||!d.ok)throw Error(d.error||'Could not load orders');orders=d.orders||[];render();$('status').textContent=orders.length+' orders loaded.'}catch(e){$('status').textContent=e.message;$('status').style.color='#c43c55'}}async function setStatus(id,status){try{$('status').textContent='Updating order…';const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pw},body:JSON.stringify({action:'status',id,status})});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok||!d.ok)throw Error(d.error||'Could not update order');const i=orders.findIndex(o=>o.id===id);if(i>=0)orders[i]=d.order;render();$('status').textContent='✓ Order '+status; }catch(e){$('status').textContent=e.message;$('status').style.color='#c43c55'}}function render(){const q=$('search').value.toLowerCase().trim();const list=orders.filter(o=>(filter==='ALL'||o.status===filter)&&(!q||[o.id,o.name,o.phone,o.paymentRef].join(' ').toLowerCase().includes(q)));$('list').innerHTML=list.length?list.map(o=>{const items=(o.items||[]).map(i=>'<li>'+esc(i.name)+' × '+Number(i.qty||1)+' — ₹'+Number(i.price||0).toLocaleString('en-IN')+(i.size?' · '+esc(i.size):'')+(i.colour?' · '+esc(i.colour):'')+'</li>').join('');const buttons=o.status==='PENDING'?'<div class="actions" style="margin-top:12px"><button class="btn approve" onclick="setStatus(\''+esc(o.id)+'\',\'PAID\')">✅ Approve / PAID</button><button class="btn reject" onclick="setStatus(\''+esc(o.id)+'\',\'REJECTED\')">❌ Reject</button></div>':o.status==='PAID'?'<div class="actions" style="margin-top:12px"><button class="btn reject" onclick="setStatus(\''+esc(o.id)+'\',\'REJECTED\')">↩️ Mark Rejected</button></div>':'';return '<article class="order"><div class="head"><div><strong>'+esc(o.id)+'</strong><div class="muted">'+new Date(o.createdAt).toLocaleString('en-IN')+'</div></div>'+badge(o.status)+'</div><p><strong>'+esc(o.name)+'</strong><br>📞 '+esc(o.phone)+'<br>📍 '+esc(o.address)+'</p><ul class="items">'+items+'</ul><div><strong>Total: ₹'+Number(o.total||0).toLocaleString('en-IN')+'</strong><br><span class="muted">Payment: '+esc(o.paymentMethod||'UPI')+' · UTR: '+esc(o.paymentRef)+'</span></div>'+buttons+'</article>'}).join(''):'<div class="empty">No orders found.</div>'}$('loginBtn').onclick=async()=>{pw=$('pw').value.trim();if(!pw){$('loginStatus').textContent='Password enter karo.';return}$('loginStatus').textContent='Checking…';await load();if(orders.length||$('status').textContent.includes('orders loaded')){$('login').classList.add('hide');$('dash').classList.remove('hide')}};$('refresh').onclick=load;$('search').oninput=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});</script></body></html>
